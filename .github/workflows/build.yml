name: Build macOS DMG

# Builds an unsigned Apple Silicon .dmg and attaches it to the run as a downloadable artifact.
# Nothing is published to Releases.  Run it from the Actions tab ("Run workflow"), or it runs on pull requests.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-15

    steps:
      # Third-party actions are pinned to full commit SHAs so a moved tag cannot change what runs here.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:mac -- --arm64 --publish never
        env:
          # No Apple certificate: skip keychain lookup and let electron-builder ad-hoc sign.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: SHA-256 of the DMG
        run: shasum -a 256 dist/*.dmg | tee dist/SHA256SUMS.txt

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GVoicePlus-mac-arm64
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
